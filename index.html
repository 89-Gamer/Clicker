<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Overflow 🥞</title>
<style>
  :root { --ink:#3b2412; --card:#fff8ec; --accent:#e8892b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: system-ui, sans-serif; color:var(--ink); overflow:hidden; }
  #game { position:fixed; inset:0; display:flex; flex-direction:column; }
  canvas { flex:1; width:100%; display:block; min-height:0; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px; text-align:center; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.5); pointer-events:none; }
  #count { font-size:2.2rem; font-weight:800; }
  #sub { font-size:.95rem; opacity:.95; }
  #milestone { height:1.4em; font-weight:700; color:#ffe27a; }
  #panel { background:var(--card); padding:10px; display:flex; gap:8px; align-items:stretch; border-top:3px solid var(--accent); }
  #flip { flex:0 0 auto; width:120px; font-size:1.2rem; font-weight:800; border:none; border-radius:14px; background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 5px 0 #a85a12; }
  #flip:active { transform:translateY(4px); box-shadow:0 1px 0 #a85a12; }
  #upgrades { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .up { border:2px solid var(--accent); background:#fff; border-radius:10px; padding:6px; font-size:.8rem; cursor:pointer; text-align:left; color:var(--ink); }
  .up b { display:block; font-size:.9rem; }
  .up:disabled { opacity:.45; cursor:not-allowed; }
  #reset { position:absolute; right:8px; top:8px; pointer-events:auto; font-size:.7rem; background:rgba(0,0,0,.35); color:#fff; border:none; border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="count">0</div>
    <div id="sub"></div>
    <div id="milestone"></div>
    <button id="reset">Reset</button>
  </div>
  <canvas id="c"></canvas>
  <div id="panel">
    <button id="flip">FLIP! 🥞</button>
    <div id="upgrades"></div>
  </div>
</div>

<script>
(() => {
  const KEY = "stack-overflow-save-v1";
  const UPS = [
    { id:"spatula", name:"Bigger Spatula", desc:"+1 per click", base:25,  grow:1.5 },
    { id:"flipper", name:"Auto-Flipper",   desc:"+1 per second", base:50,  grow:1.6 },
    { id:"griddle", name:"Mega Griddle",   desc:"+10 per second", base:600, grow:1.7 },
  ];
  const MILESTONES = [
    [10, "A little stack!"], [100, "Past the roof! 🏠"], [1000, "Through the clouds ☁️"],
    [10000, "Hello, Moon 🌙"], [100000, "Deep space jam 🪐"],
  ];

  let s = { total:0, bal:0, lv:{ spatula:0, flipper:0, griddle:0 } };
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) s = Object.assign(s, d); } catch(e) {}

  const $ = id => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  let W, H, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const perClick = () => 1 + s.lv.spatula;
  const perSec = () => s.lv.flipper + 10 * s.lv.griddle;
  const cost = u => Math.floor(u.base * Math.pow(u.grow, s.lv[u.id]));
  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e4 ? (n/1e3).toFixed(1)+"k" : Math.floor(n).toLocaleString();

  // Upgrades UI
  const upBox = $("upgrades");
  const btns = UPS.map(u => {
    const b = document.createElement("button");
    b.className = "up";
    b.onclick = () => { const c = cost(u); if (s.bal >= c) { s.bal -= c; s.lv[u.id]++; update(); save(); } };
    upBox.appendChild(b);
    return b;
  });

  let rhythm = 0, lastClick = 0, shake = 0, popups = [], toast = "", toastT = 0, nextMs = 0;

  function addPancakes(n, fromClick) {
    const before = s.total;
    s.total += n; s.bal += n;
    for (const [m, label] of MILESTONES) {
      if (before < m && s.total >= m) { toast = label; toastT = 3; }
    }
    if (fromClick) {
      const now = performance.now();
      const gap = now - lastClick; lastClick = now;
      // steady rhythm (150-450ms) calms the wobble, spamming or pausing riles it up
      rhythm = gap > 150 && gap < 450 ? Math.min(1, rhythm + 0.12) : Math.max(0, rhythm - 0.1);
      popups.push({ x: W/2 + (Math.random()-.5)*80, y: H*0.35, t: 0, n });
    }
  }

  $("flip").addEventListener("pointerdown", e => { e.preventDefault(); addPancakes(perClick(), true); shake = 1; update(); });
  addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); addPancakes(perClick(), true); shake = 1; update(); } });
  $("reset").onclick = () => { if (confirm("Reset all progress?")) { s = { total:0, bal:0, lv:{ spatula:0, flipper:0, griddle:0 } }; save(); update(); } };

  function update() {
    $("count").textContent = fmt(s.bal) + " 🥞";
    const meters = s.total * 0.015;
    $("sub").textContent = `Tower: ${fmt(s.total)} pancakes · ${meters < 1000 ? meters.toFixed(1)+" m" : (meters/1000).toFixed(2)+" km"} · ${perSec()}/s`;
    UPS.forEach((u, i) => {
      btns[i].innerHTML = `<b>${u.name} (Lv ${s.lv[u.id]})</b>${u.desc}<br>Cost: ${fmt(cost(u))}`;
      btns[i].disabled = s.bal < cost(u);
    });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }

  // Sky color by tower size
  const stops = [
    [0,   [135,206,235]], [100, [255,190,130]], [1000, [90,150,230]],
    [10000, [15,15,45]], [100000, [5,0,20]],
  ];
  function sky(n) {
    for (let i = 0; i < stops.length - 1; i++) {
      const [a, ca] = stops[i], [b, cb] = stops[i+1];
      if (n <= b) {
        const t = Math.max(0, (n - a) / (b - a));
        return ca.map((v, k) => Math.round(v + (cb[k]-v)*t));
      }
    }
    return stops[stops.length-1][1];
  }
  const stars = Array.from({length:80}, () => [Math.random(), Math.random(), Math.random()]);

  function draw(t) {
    const n = Math.floor(s.total);
    const c = sky(n);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgb(${c[0]*0.6|0},${c[1]*0.6|0},${c[2]*0.8|0})`);
    g.addColorStop(1, `rgb(${c[0]},${c[1]},${c[2]})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (n > 800) {
      ctx.fillStyle = "#fff";
      const a = Math.min(1, (n - 800) / 8000);
      stars.forEach(([x, y, r]) => { ctx.globalAlpha = a * (0.4 + 0.6 * Math.abs(Math.sin(t/900 + r*9))); ctx.fillRect(x*W, y*H, 1+r*1.5, 1+r*1.5); });
      ctx.globalAlpha = 1;
    }
    if (n >= 10000) { // moon
      ctx.fillStyle = "#eee"; ctx.beginPath(); ctx.arc(W*0.8, H*0.25, 36, 0, 7); ctx.fill();
      ctx.fillStyle = "#ccc"; ctx.beginPath(); ctx.arc(W*0.8-10, H*0.25-6, 8, 0, 7); ctx.fill();
    }

    // Tower
    const groundY = H - 40, baseThick = 7, baseW = Math.min(180, W * 0.45);
    const avail = H * 0.7;
    const scale = Math.min(1, avail / Math.max(1, n * baseThick));
    const step = Math.max(1, Math.floor(n / 500));
    const thick = baseThick * scale * step;

    // ground
    ctx.fillStyle = n > 5000 ? "#555" : "#6b8f3a"; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = "#c9a36a"; ctx.fillRect(W/2 - baseW/2 - 14, groundY - 6, baseW + 28, 8); // plate

    const wobbleAmp = Math.min(40, Math.sqrt(n) * 0.9) * scale * (1 - 0.8 * rhythm) + (shake * 3);
    const sway = (i) => Math.sin(t/500 + i*0.02) * wobbleAmp * (i / Math.max(1, n));
    ctx.save();
    const tilt = Math.sin(t/700) * 0.01 * (1 - rhythm*0.8);
    ctx.translate(W/2, groundY); ctx.rotate(tilt);

    for (let i = 0; i < n; i += step) {
      const y = -(i / step + 1) * thick;
      const x = sway(i) + Math.sin(i * 12.9898) * 2 * scale;
      const w = baseW * (0.92 + 0.08 * Math.sin(i * 3.1));
      let top = "#e9b55e", side = "#c98a33";
      if (n > 1000 && i > 900) { top = "#b48cf0"; side = "#7c55c7"; } // space jam zone
      ctx.fillStyle = side;
      ctx.fillRect(x - w/2, y, w, Math.max(1, thick));
      ctx.fillStyle = top;
      ctx.fillRect(x - w/2, y, w, Math.max(1, thick * 0.55));
      if (i % 25 === 0 && scale > 0.05) { // syrup drip
        ctx.fillStyle = "rgba(120,50,10,.85)";
        ctx.fillRect(x - w/2 + w*0.2, y, w*0.15, thick * 2.5);
      }
      if (i % 10 === 0 && scale > 0.2) { // butter
        ctx.fillStyle = "#fff3a0"; ctx.fillRect(x - 8*scale, y - thick*0.4, 16*scale, thick*0.7);
      }
      if (i % 50 === 0 && scale > 0.1) { // berry
        ctx.fillStyle = "#d1213a"; ctx.beginPath(); ctx.arc(x + w*0.25, y, Math.max(2, 5*scale), 0, 7); ctx.fill();
      }
    }
    // top berry
    const topY = -(Math.ceil(n/step) + 1) * thick;
    if (n > 0) { ctx.fillStyle = "#d1213a"; ctx.beginPath(); ctx.arc(sway(n), topY - 4, Math.max(3, 8*scale), 0, 7); ctx.fill(); }
    ctx.restore();

    // popups
    popups.forEach(p => { p.t += 0.02; ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui"; ctx.textAlign = "center"; ctx.fillText("+" + p.n, p.x, p.y - p.t * 60); });
    ctx.globalAlpha = 1; popups = popups.filter(p => p.t < 1);

    // rhythm bar
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(W/2 - 60, H - 30 - 0, 120, 8);
    ctx.fillStyle = "#7dff9a"; ctx.fillRect(W/2 - 60, H - 30, 120 * rhythm, 8);

    $("milestone").textContent = toastT > 0 ? toast : "";
  }

  let last = performance.now(), acc = 0, saveT = 0;
  function loop(t) {
    const dt = Math.min(0.25, (t - last) / 1000); last = t;
    const ps = perSec();
    if (ps) { acc += ps * dt; if (acc >= 1) { const k = Math.floor(acc); acc -= k; addPancakes(k, false); update(); } }
    rhythm = Math.max(0, rhythm - dt * 0.15);
    shake *= 0.85; if (toastT > 0) toastT -= dt;
    saveT += dt; if (saveT > 5) { save(); saveT = 0; }
    draw(t);
    requestAnimationFrame(loop);
  }
  update(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
